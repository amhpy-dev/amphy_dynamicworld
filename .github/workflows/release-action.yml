name: Release Action

on:
  workflow_run:
    workflows: [Create New Release]
    types:
      - completed

permissions:
  contents: write

jobs:
  release-action:
    name: Create Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Get the latest tag
        run: echo "LATEST_TAG=$(git tag --sort=-creatordate | head -n 1)" >> $GITHUB_ENV

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Build the panel
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Bundle files
        run: |
          name=${{ github.event.repository.name }}
          mkdir -p ./temp/$name/web
          cp ./{README.md,fxmanifest.lua} ./temp/$name
          cp -r ./{client,server,modules,data,locales,sql,docs} ./temp/$name
          cp -r ./web/dist ./temp/$name/web
          rsync -a --exclude map.png ./web/mapStyles ./temp/$name/web
          cd ./temp && zip -r ../$name.zip ./$name

      - name: Update CHANGELOG
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ env.LATEST_TAG }}
          includeInvalidCommits: true
          writeToFile: false

      - name: Create Release
        uses: ncipollo/release-action@v1.14.0
        with:
          allowUpdates: true
          draft: false
          makeLatest: true
          name: ${{ env.LATEST_TAG }}
          tag: ${{ env.LATEST_TAG }}
          body: ${{ steps.changelog.outputs.changes }}
          artifacts: ${{ github.event.repository.name }}.zip
          token: ${{ secrets.GITHUB_TOKEN }}
